.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
h2{margin:0;font-size:16px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.kicker{font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.panel{background:var(--panel);border:1.5px solid var(--dark);padding:18px}
input[type=text],input[type=tel],input[type=password],input[type=search],select,textarea{width:100%;min-width:0;background:var(--field);color:var(--text);border:1px solid var(--edge);border-radius:0;padding:10px 12px;font:500 15px var(--font)}
textarea{resize:vertical;min-height:64px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--dark);outline-offset:2px;background:#fff}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.btn{display:inline-block;text-decoration:none;text-align:center;font:700 13px var(--font);letter-spacing:.06em;text-transform:uppercase;line-height:1.4;color:var(--text);background:#fff;border:1.5px solid var(--dark);padding:9px 16px;cursor:pointer;border-radius:0}
.btn:hover{background:var(--dark);color:var(--on-dark)}
.btn.main{background:linear-gradient(180deg,#2a2f38,#0c0e12);color:var(--on-dark)}
.btn.main:hover{background:#3b424e}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--danger);font-size:13.5px;font-weight:500;margin:0}
.err:empty{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* login */
.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}
/* top */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--edge);padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px}
@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters>:first-child{grid-column:1/-1}}
/* team cards */
.list{display:flex;flex-direction:column;gap:12px}
.team{background:var(--panel);border:1px solid var(--edge);display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px}
.team.cancelled{background:#fbf3f3;border-color:#e3b9bb}
@media(max-width:600px){.team{grid-template-columns:1fr}}
.imgs{display:flex;gap:10px}
.thumb{width:92px;height:92px;border:1px dashed #9aa1ac;background:var(--field);display:grid;place-items:center;overflow:hidden;padding:0;cursor:pointer;position:relative}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb small{position:absolute;left:0;bottom:0;background:var(--dark);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 6px;text-transform:uppercase}
.thumb.empty{cursor:default;color:#8b929d;font-size:12px;text-align:center}
.info{min-width:0;display:flex;flex-direction:column;gap:6px}
.name{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.name b{font-size:18px;font-weight:800;overflow-wrap:anywhere}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.pill.ok{background:var(--ok-bg);color:#0d6b3b}.pill.bad{background:var(--lock-bg);color:#a11f27}.pill.gray{background:var(--field);color:var(--muted);border:1px solid var(--edge)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:2px 16px;font-size:14px;color:var(--soft)}
.meta b{color:var(--text);font-weight:600}
.pl{margin:0;padding:8px 10px;background:var(--field);border:1px solid var(--edge);font-size:13.5px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px 14px;list-style:none;font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--soft);background:var(--warn-bg);border:1px solid #e3c24a;padding:6px 10px}
.empty-state{text-align:center;color:var(--muted);padding:40px 10px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(12,14,18,.6);display:grid;place-items:start center;overflow:auto;padding:24px 12px;z-index:10}
.dlg{background:var(--panel);border:1.5px solid var(--dark);width:100%;max-width:640px;padding:20px;display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.prow{display:grid;grid-template-columns:22px 1fr 1.4fr;gap:8px;align-items:center}
.prow span{font-weight:700;color:var(--muted);font-size:13px}
.lb{background:rgba(12,14,18,.88);cursor:zoom-out}
.lb img{max-width:96vw;max-height:92vh;object-fit:contain;background:#fff}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;font-weight:600;font-size:14px;z-index:20;max-width:92vw}
</style>
</head>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var SLOTS = ["13:00", "15:00", "18:00", "20:00", "22:00", "23:50"];
  var teams = [], editing = null, deleting = null;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function toast(msg) { var t = el("div", "toast", msg); t.setAttribute("role", "status"); document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
  function fmt(ms) { var d = new Date(ms + 7 * 3600000), p = function (n) { return (n < 10 ? "0" : "") + n; }; return p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) + " " + p(d.getUTCDate()) + "/" + p(d.getUTCMonth() + 1); }

  function api(method, url, body, isForm) {
    var o = { method: method, credentials: "same-origin", headers: {} };
    if (body && !isForm) { o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(body); }
    if (body && isForm) o.body = body;
    return fetch(url, o).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401 && url !== "/api/admin/login") { showLogin(); }
        if (!r.ok) throw new Error(j.error || "Có lỗi xảy ra.");
        return j;
      });
    });
  }

  /* ---- đăng nhập ---- */
  function showLogin() { $("appView").hidden = true; $("loginView").hidden = false; $("pw").focus(); }
  function showApp() { $("loginView").hidden = true; $("appView").hidden = false; load(); }
  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    $("loginBtn").disabled = true; $("loginErr").textContent = "";
    api("POST", "/api/admin/login", { password: $("pw").value }).then(function () { $("pw").value = ""; showApp(); })
      .catch(function (err) { $("loginErr").textContent = err.message; })
      .then(function () { $("loginBtn").disabled = false; });
  });
  $("logout").addEventListener("click", function () { api("POST", "/api/admin/logout", {}).then(showLogin); });

  /* ---- bộ lọc ---- */
  SLOTS.forEach(function (s) { var o = el("option", "", s); o.value = s; $("fSlot").appendChild(o); var o2 = o.cloneNode(true); $("eSlot").appendChild(o2); });
  for (var g = 1; g <= 8; g++) { var o = el("option", "", "Bảng " + g); o.value = g; $("fGrp").appendChild(o); $("eGrp").appendChild(o.cloneNode(true)); }
  ["q", "fDay", "fSlot", "fGrp", "fStatus"].forEach(function (id) { $(id).addEventListener("input", render); });

  function dmy(d) { return d.split("-").reverse().join("/"); }
  function fillDays() {
    var sel = $("fDay"), cur = sel.value, days = [];
    teams.forEach(function (t) { if (days.indexOf(t.day) < 0) days.push(t.day); });
    days.sort().reverse(); sel.textContent = "";
    var all = el("option", "", "Mọi ngày"); all.value = ""; sel.appendChild(all);
    days.forEach(function (d) { var o = el("option", "", dmy(d)); o.value = d; sel.appendChild(o); });
    sel.value = days.indexOf(cur) >= 0 ? cur : "";
  }
  function load() {
    return api("GET", "/api/admin/teams").then(function (r) { teams = r.teams; fillDays(); render(); }).catch(function (e) { toast(e.message); });
  }

  /* ---- danh sách ---- */
  function thumb(file, label) {
    if (!file) { var b = el("div", "thumb empty", "Chưa có " + label.toLowerCase()); return b; }
    var b = el("button", "thumb"); b.type = "button"; b.setAttribute("aria-label", "Xem " + label);
    var i = el("img"); i.src = "/api/admin/file/" + file; i.alt = label; i.loading = "lazy";
    b.appendChild(i); b.appendChild(el("small", "", label));
    b.addEventListener("click", function () { $("lbImg").src = i.src; $("lb").hidden = false; });
    return b;
  }
  function render() {
    var q = $("q").value.trim().toLowerCase(), fd = $("fDay").value, fs = $("fSlot").value, fg = $("fGrp").value, fst = $("fStatus").value;
    var shown = teams.filter(function (t) {
      if (fd && t.day !== fd) return false;
      if (fs && t.slot !== fs) return false;
      if (fg && t.grp !== fg) return false;
      if (fst === "active" && t.cancelled) return false;
      if (fst === "cancelled" && !t.cancelled) return false;
      if (!q) return true;
      var hay = [t.team, t.phone, t.uid, t.zalo, t.note].concat(t.players.map(function (p) { return p.id + " " + p.name; })).join(" ").toLowerCase();
      return hay.indexOf(q) >= 0;
    }).sort(function (a, b) { return b.day.localeCompare(a.day) || (a.slot + a.grp).localeCompare(b.slot + b.grp) || a.createdAt - b.createdAt; });

    $("sTotal").textContent = teams.length;
    $("sActive").textContent = teams.filter(function (t) { return !t.cancelled; }).length;
    $("sCancel").textContent = teams.filter(function (t) { return t.cancelled; }).length;
    $("sPlayers").textContent = teams.reduce(function (n, t) { return n + t.players.length; }, 0);

    var list = $("list"); list.textContent = "";
    if (!shown.length) { list.appendChild(el("div", "panel empty-state", teams.length ? "Không có đội nào khớp bộ lọc." : "Chưa có đội nào đăng ký.")); return; }
    shown.forEach(function (t) {
      var c = el("article", "team" + (t.cancelled ? " cancelled" : ""));
      var imgs = el("div", "imgs"); imgs.appendChild(thumb(t.logoFile, "Logo")); imgs.appendChild(thumb(t.billFile, "Bill")); c.appendChild(imgs);
      var info = el("div", "info");
      var nm = el("div", "name"); nm.appendChild(el("b", "", t.team));
      nm.appendChild(el("span", "pill " + (t.cancelled ? "bad" : "ok"), t.cancelled ? "Đã hủy" : "Đang giữ slot"));
      nm.appendChild(el("span", "pill gray", dmy(t.day) + " · " + t.slot + " · Bảng " + t.grp));
      if (t.source === "admin") nm.appendChild(el("span", "pill gray", "BTC thêm"));
      info.appendChild(nm);
      var meta = el("div", "meta");
      [["SĐT", t.phone], ["UID đội trưởng", t.uid], ["Zalo", t.zalo], ["Đăng ký lúc", fmt(t.createdAt)]].forEach(function (x) {
        var d = el("div", "", x[0] + ": "); d.appendChild(el("b", "", x[1])); meta.appendChild(d);
      });
      info.appendChild(meta);
      if (t.players.length) {
        var ul = el("ul", "pl");
        t.players.forEach(function (p, i) { ul.appendChild(el("li", "", (i + 1) + ". " + p.id + " · " + p.name)); });
        info.appendChild(ul);
      } else info.appendChild(el("div", "meta", "Chưa có code tên."));
      if (t.note) info.appendChild(el("div", "note", "Ghi chú: " + t.note));
      var act = el("div", "row");
      var be = el("button", "btn sm", "Sửa / thêm thông tin"); be.type = "button"; be.addEventListener("click", function () { openEdit(t); });
      act.appendChild(be);
      if (t.logoFile) { var a1 = el("a", "btn sm", "Tải logo"); a1.href = "/api/admin/file/" + t.logoFile + "?dl=1"; act.appendChild(a1); }
      if (t.billFile) { var a2 = el("a", "btn sm", "Tải bill"); a2.href = "/api/admin/file/" + t.billFile + "?dl=1"; act.appendChild(a2); }
      var bd = el("button", "btn sm danger", "Xóa đội"); bd.type = "button"; bd.addEventListener("click", function () { deleting = t; $("delText").textContent = "Xóa đội \"" + t.team + "\" (" + dmy(t.day) + " " + t.slot + " · Bảng " + t.grp + ") cùng logo, bill và code tên. Không thể hoàn tác."; $("delErr").textContent = ""; $("delModal").hidden = false; });
      act.appendChild(bd);
      info.appendChild(act);
      c.appendChild(info); list.appendChild(c);
    });
  }

  /* ---- sửa / thêm ---- */
  function playerRows(list) {
    var box = $("ePlayers"); box.textContent = "";
    for (var i = 0; i < 6; i++) {
      var p = list[i] || {}, r = el("div", "prow"), n = el("span", "", i + 1);
      var id = el("input"); id.type = "text"; id.inputMode = "numeric"; id.maxLength = 14; id.placeholder = "ID game"; id.value = p.id || ""; id.setAttribute("aria-label", "ID game người chơi " + (i + 1));
      id.addEventListener("input", function () { this.value = this.value.replace(/\D/g, ""); });
      var nm = el("input"); nm.type = "text"; nm.maxLength = 30; nm.placeholder = "Tên game"; nm.value = p.name || ""; nm.setAttribute("aria-label", "Tên game người chơi " + (i + 1));
      r.appendChild(n); r.appendChild(id); r.appendChild(nm); box.appendChild(r);
    }
  }
  function readPlayers() {
    return [].map.call($("ePlayers").querySelectorAll(".prow"), function (r) { var i = r.querySelectorAll("input"); return { id: i[0].value, name: i[1].value }; });
  }
  function todayVN() { var d = new Date(Date.now() + 7 * 3600000), p = function (n) { return (n < 10 ? "0" : "") + n; }; return d.getUTCFullYear() + "-" + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate()); }
  function openEdit(t) {
    editing = t || null;
    $("editTitle").textContent = t ? "Sửa đội: " + t.team : "Thêm đội mới";
    $("eTeam").value = t ? t.team : ""; $("ePhone").value = t ? t.phone : ""; $("eUid").value = t ? t.uid : ""; $("eZalo").value = t ? t.zalo : "";
    $("eDate").value = t ? t.day : todayVN(); $("eSlot").value = t ? t.slot : SLOTS[0]; $("eGrp").value = t ? t.grp : "1";
    $("eNote").value = t ? t.note : ""; $("eCancel").checked = !!(t && t.cancelled); $("eCancelRow").hidden = !t;
    $("eLogo").value = ""; $("eBill").value = ""; $("editErr").textContent = "";
    playerRows(t ? t.players : []);
    $("editModal").hidden = false; $("eTeam").focus();
  }
  $("addBtn").addEventListener("click", function () { openEdit(null); });
  $("editClose").addEventListener("click", function () { $("editModal").hidden = true; });
  $("eUid").addEventListener("input", function () { this.value = this.value.replace(/\D/g, ""); });
  $("editForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = { team: $("eTeam").value.trim(), phone: $("ePhone").value.trim(), uid: $("eUid").value, zalo: $("eZalo").value.trim(), date: $("eDate").value, slot: $("eSlot").value, grp: $("eGrp").value, note: $("eNote").value };
    var players = readPlayers(), logo = $("eLogo").files[0], bill = $("eBill").files[0], btn = $("editSave");
    if ((logo && logo.size > 5242880) || (bill && bill.size > 5242880)) { $("editErr").textContent = "Ảnh vượt quá 5MB."; return; }
    btn.disabled = true; $("editErr").textContent = "";
    var p;
    if (editing) {
      f.players = players; f.cancelled = $("eCancel").checked;
      p = api("PUT", "/api/admin/teams/" + editing.id, f).then(function () {
        if (!logo && !bill) return;
        var fd = new FormData(); if (logo) fd.append("logo", logo); if (bill) fd.append("bill", bill);
        return api("POST", "/api/admin/teams/" + editing.id + "/files", fd, true);
      });
    } else {
      var fd = new FormData(); Object.keys(f).forEach(function (k) { fd.append(k, f[k]); });
      fd.append("players", JSON.stringify(players)); if (logo) fd.append("logo", logo); if (bill) fd.append("bill", bill);
      p = api("POST", "/api/admin/teams", fd, true);
    }
    p.then(function () { $("editModal").hidden = true; toast("Đã lưu."); return load(); })
      .catch(function (err) { $("editErr").textContent = err.message; })
      .then(function () { btn.disabled = false; });
  });

  /* ---- xóa ---- */
  $("delNo").addEventListener("click", function () { $("delModal").hidden = true; });
  $("delOk").addEventListener("click", function () {
    if (!deleting) return;
    api("DELETE", "/api/admin/teams/" + deleting.id).then(function () { $("delModal").hidden = true; toast("Đã xóa đội."); return load(); })
      .catch(function (err) { $("delErr").textContent = err.message; });
  });

  $("lb").addEventListener("click", function () { this.hidden = true; });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { ["lb", "editModal", "delModal"].forEach(function (id) { $(id).hidden = true; }); } });

  api("GET", "/api/admin/me").then(showApp).catch(showLogin);
})();
</script>
</body>
</html>
